name: Bug report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, please follow [SECURITY.md](../../SECURITY.md) instead of opening a public issue.

  - type: dropdown
    id: area
    attributes:
      label: Where does this happen?
      options:
        - Frontend (Next.js app)
        - Backend / Modal endpoint (backend/main.py)
        - Evo2 model / inference results
        - Gene search or external API data (UCSC / NCBI / ClinVar)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Search for gene '...'
        3. Click '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Browser:
        - Node version (if relevant):
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any console errors, Modal logs (`modal app logs nucleus`), or screenshots. This will be rendered as-is, no need for backticks.
      render: shell
    validations:
      required: false
